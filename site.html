<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }

        .btnnav{
            border-radius: 10%;
            margin-left: 10px;
            height: 30px;
            width: 130px;
            color: rgb(28, 117, 189);
        }

        .btnnav:hover{
            background-color: rgb(52, 43, 128);
            color: rgb(118, 141, 190);
        }

        .btnfooter{
            margin-left: 10px;
            height: 50px;
            width: 150px;
            background-color: rgb(52, 76, 107);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            gap: 10px;
        }

        .btnfooter:hover{
            background-color: rgb(23, 22, 90);
            color: rgb(26, 67, 204);
        }
        a{
            text-decoration: none;
        }
        .card{
            border: 1px;
            color: rgb(7, 7, 7);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;    
            justify-content: center;
           
        }

        /* o @media serve para alterar as propriedades das tags com base no tamanho do dispositivo
        para garantir a responsivisade do site, temos que verificar como fica a estilizaçao
        em varios tamanhos de telas diferentes, pode ser que no computador fique ok, porem quando acessado
        pelo celular o site quebre, nesse caso sera necessario aplicar ajuste ajustes no tamanho de tela com 
        o @media()
        
        *usamos o !important para forçar a estilizaçao em uma tag, como a tag pode ter id e varias classes
        o html e css precisam saber qual estilo aplicar, forçamos isso usando o !important no final dp atributo


        */
        @media(max-width:750px){
            button{
                width: 50px!important;
                height: 30px!important;
            }
        }
        
                
        
    </style>
</head>
<body>
    <!--

             <img width="48" height="48" src="https://img.icons8.com/?size=80&id=BrU2BBoRXiWq&format=png" alt="">instagram</button></a>

</body>
</html>
